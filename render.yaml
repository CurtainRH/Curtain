# Render Blueprint for the Curtain backend (operator + keeper + Postgres).
# The frontend is deployed separately (Vercel/Lovable). See docs/DEPLOY_RENDER.md.
databases:
  - name: curtain-db
    databaseName: curtain
    user: curtain
    plan: basic-256mb        # paid plans include daily backups; pick a bigger one as volume grows
    postgresMajorVersion: "16"
    ipAllowList: []          # internal connections only

services:
  - type: web
    name: curtain-operator
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # always on: the operator must tick every few seconds
    numInstances: 1          # exactly one operator (it holds the signing key and the chain cursor)
    healthCheckPath: /health
    autoDeploy: false        # deploy deliberately; a bad operator build can delay payouts
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: curtain-db, property: connectionString }
      - { key: CHAIN_ID, value: "4663" }
      - { key: RPC_HTTP, sync: false }              # dedicated RPC provider URL
      - { key: OPERATOR_PRIVATE_KEY, sync: false }  # the vault's operator key
      - { key: VAULT_ADDR, sync: false }            # from contracts/deployments/4663.json
      - { key: TOKENS, sync: false }                # JSON {"USDG":"0x...","NVDA":"0x...",...}
      - { key: DEX_ROUTER_ADDR, value: "0xcaf681a66d020601342297493863e78c959e5cb2" }   # Uniswap SwapRouter02
      - { key: UNISWAP_QUOTER_ADDR, value: "0x33e885ed0ec9bf04ecfb19341582aadcb4c8a9e7" } # Uniswap QuoterV2
      - { key: ROUTE, value: uniswap }                # best of Uniswap v3 and v4 per swap
      - { key: V4_ADAPTER_ADDR, sync: false }       # v4Adapter from contracts/deployments/4663.json
      - { key: V4_QUOTER_ADDR, value: "0x8dc178efb8111bb0973dd9d722ebeff267c98f94" }    # Uniswap V4Quoter
      - { key: SLIPPAGE_BPS, value: "50" }
      - { key: KEEPER_FEE_BPS, value: "5" }
      - { key: TICK_MS, value: "5000" }
      - { key: START_BLOCK, sync: false }           # the vault's deployment block
      - { key: MIN_OPERATOR_BALANCE_WEI, value: "5000000000000000" }

  - type: worker
    name: curtain-keeper
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: bun run --cwd services/keeper start
    plan: starter
    autoDeploy: false
    envVars:
      - key: OPERATOR_API
        fromService: { type: web, name: curtain-operator, property: hostport }
      - { key: CHAIN_ID, value: "4663" }
      - { key: RPC_HTTP, sync: false }
      - { key: KEEPER_PRIVATE_KEY, sync: false }    # a separate hot wallet with a little ETH
      - { key: VAULT_ADDR, sync: false }
      - { key: KEEPER_TICK_MS, value: "5000" }
