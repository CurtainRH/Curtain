# Local dev parity for what will run on Railway as managed plugins.
# This file is for local development only — Railway provisions Postgres
# and Redis as separate services in production, not via this compose file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: curtain
      POSTGRES_PASSWORD: curtain
      POSTGRES_DB: curtain
    ports:
      - "5432:5432"
    volumes:
      - curtain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curtain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - curtain_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  curtain_postgres_data:
  curtain_redis_data:
